name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Domain — typecheck + tests
        run: npm run typecheck && npm run test:domain
      - name: Contracts — tests + coverage
        run: npm run test:contracts && npm run coverage:contracts
